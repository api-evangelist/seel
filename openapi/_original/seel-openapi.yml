components:
  securitySchemes:
    SeelApiKey:
      type: apiKey
      in: header
      name: X-Seel-Api-Key
      description: >-
        Per-merchant API key. Obtain from Seel (merchant@seel.com). The API
        version is selected with the companion X-Seel-Api-Version header
        (e.g. 2.6.0).
  responses:
    OK:
      description: Successful response
      content:
        application/json:
          schema: {type: object}
    Error:
      description: Error response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      description: Seel error envelope (not RFC 9457 problem+json).
      properties:
        error: {type: string, description: Human-readable description of the error.}
        trace_id: {type: string, description: Unique trace identifier to include when contacting support.}
    QuoteRequest:
      type: object
      required: [line_items, session_id, shipping_address, customer, type, device_category, device_platform, is_default_on]
      properties:
        line_items: {type: array, items: {type: object}, description: Cart line items (Item objects).}
        session_id: {type: string}
        shipping_address: {type: object}
        customer: {type: object}
        type: {type: string, description: Protection type (e.g. Worry-Free Purchase).}
        device_category: {type: string}
        device_platform: {type: string}
        is_default_on: {type: boolean}
        cart_id: {type: string}
        merchant_id: {type: string}
        device_id: {type: string}
        client_ip: {type: string}
        extra_info: {type: object}
    Quote:
      type: object
      properties:
        quote_id: {type: string}
        cart_id: {type: string}
        merchant_id: {type: string}
        session_id: {type: string}
        device_id: {type: string}
        device_category: {type: string}
        device_platform: {type: string}
        client_ip: {type: string}
        type: {type: string}
        price: {type: number}
        sales_tax: {type: number}
        currency: {type: string}
        status: {type: string}
        is_default_on: {type: boolean}
        created_ts: {type: string}
        line_items: {type: array, items: {type: object}}
        coverages: {type: array, items: {type: object}}
        shipping_address: {type: object}
        customer: {type: object}
        extra_info: {type: object}
    OrderRequest:
      type: object
      required: [order_id, order_number, session_id, created_ts, line_items, shipping_address, customer, device_category, device_platform]
      properties:
        order_id: {type: string}
        order_number: {type: string}
        session_id: {type: string}
        created_ts: {type: string}
        line_items: {type: array, items: {type: object}}
        shipping_address: {type: object}
        customer: {type: object}
        device_category: {type: string}
        device_platform: {type: string}
        seel_services:
          type: array
          description: Protection services to bind; each references a quote_id.
          items:
            type: object
            properties:
              quote_id: {type: string}
    Order:
      type: object
      properties:
        order_id: {type: string}
        order_number: {type: string}
        session_id: {type: string}
        line_items: {type: array, items: {type: object}}
        shipping_address: {type: object}
        customer: {type: object}
        seel_services:
          type: array
          items:
            type: object
            properties:
              contract_id: {type: string}
              quote_id: {type: string}
        fulfillments:
          type: array
          items:
            type: object
            properties:
              fulfillment_id: {type: string}
        refunds:
          type: array
          items:
            type: object
            properties:
              refund_id: {type: string}
