aid: seel
name: Seel
description: >-
  Seel is a post-purchase protection and e-commerce insurance platform that helps
  online merchants offer Worry-Free Purchase coverage, Extended Warranty, and
  return, fulfillment, and price-drop protection to their shoppers. Its API lets
  merchants request protection Quotes for a cart, bind coverage to Orders
  (creating Contracts), manage Products, Fulfillments, Claims, and Bills, and emit
  Events, with contract and claim lifecycle changes delivered via webhooks. Seel
  serves 5,000+ merchants and has protected 24M+ orders. Backed by Lightspeed
  Venture Partners and Techstars.
